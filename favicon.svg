<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Obsidian Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151722"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>

    <!-- Ember Ambient Core Gradient -->
    <radialGradient id="emberRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7d58" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fc5b2e" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#c4300a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fc5b2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Facet Gradients for the 3D Organic Ember Blob -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9977" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea4e22" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a1d04" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fc5b2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="blobGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Rounded Tile -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" stroke="#fc5b2e" stroke-opacity="0.4" stroke-width="2.5"/>

  <!-- Radial Ambient Core Behind Blob -->
  <circle cx="64" cy="64" r="50" fill="url(#emberRadial)" opacity="0.65"/>

  <!-- 3D Polyhedral Organic Ember Blob (Representing the Hero 3D Orb) -->
  <g filter="url(#blobGlow)" opacity="0.92">
    <!-- Outer Spikes & Facets -->
    <polygon points="64,16 88,32 108,54 84,64" fill="url(#facet1)" stroke="#ffab91" stroke-width="1" stroke-opacity="0.6"/>
    <polygon points="108,54 116,80 92,98 84,64" fill="url(#facet2)" stroke="#ff7d58" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="92,98 64,114 44,98 84,64" fill="url(#facet3)" stroke="#fc5b2e" stroke-width="1" stroke-opacity="0.6"/>
    <polygon points="64,114 36,112 18,84 44,98" fill="url(#facet1)" stroke="#ea4e22" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="18,84 12,56 40,40 44,98" fill="url(#facet2)" stroke="#ff6a3d" stroke-width="1" stroke-opacity="0.55"/>
    <polygon points="12,56 32,24 64,16 40,40" fill="url(#facet3)" stroke="#ff9977" stroke-width="1" stroke-opacity="0.6"/>
    <polygon points="64,16 84,64 40,40" fill="url(#facet1)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75"/>
    <polygon points="84,64 44,98 40,40" fill="url(#facet2)" stroke="#ffaa88" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Dynamic Wireframe Constellation Struts -->
    <line x1="64" y1="16" x2="92" y2="98" stroke="#ffffff" stroke-width="1" stroke-opacity="0.45"/>
    <line x1="12" y1="56" x2="88" y2="32" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="18" y1="84" x2="108" y2="54" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="32" y1="24" x2="64" y2="114" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- Central Dark Glass Badge for MT Legibility -->
  <circle cx="64" cy="64" r="33" fill="#090a10" fill-opacity="0.82" stroke="#fc5b2e" stroke-opacity="0.55" stroke-width="1.8"/>

  <!-- MT Monogram with Space Grotesk / Modern Sans Geometric Stems -->
  <!-- Letter M -->
  <path d="M37 77 V51 L48 67 L59 51 V77" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Letter T -->
  <path d="M69 51 H91 M80 51 V77" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Ember Accent Dot -->
  <circle cx="97" cy="75" r="3.8" fill="#fc5b2e" filter="url(#dotGlow)"/>
  <circle cx="97" cy="75" r="2.2" fill="#ffb199"/>
</svg>
